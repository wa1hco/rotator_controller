name: gui

on:
  push:
    paths:
      - "software/gui/**"
      - "docs/design/configuration.md"
      - "docs/decisions/0015-configuration-and-ui.md"
      - "docs/decisions/0019-pc-gui-toolkit.md"
      - "docs/decisions/README.md"
      - "software/firmware/presets/rotor-presets.yaml"
      - ".github/workflows/gui.yml"
  pull_request:
    paths:
      - "software/gui/**"
      - "docs/design/configuration.md"
      - "docs/decisions/0015-configuration-and-ui.md"
      - "docs/decisions/0019-pc-gui-toolkit.md"
      - "docs/decisions/README.md"
      - "software/firmware/presets/rotor-presets.yaml"
      - ".github/workflows/gui.yml"

permissions:
  contents: read

jobs:
  pytest:
    name: Library, simulator, and headless GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0 fonts-dejavu-core

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e software/gui/rotatorctl
          python -m pip install -e software/gui/rotatorctl-gui --no-deps
          python -m pip install "PySide6>=6.6" "pytest>=8" "pytest-qt>=4.4"

      - name: Test
        working-directory: software/gui
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest
