name: gui

on:
  push:
    paths:
      - "software/gui/**"
      - "docs/design/configuration.md"
      - "docs/decisions/0015-configuration-and-ui.md"
      - "docs/decisions/0019-pc-gui-toolkit.md"
      - "docs/decisions/README.md"
      - "software/firmware/presets/rotor-presets.yaml"
      - ".github/workflows/gui.yml"
  pull_request:
    paths:
      - "software/gui/**"
      - "docs/design/configuration.md"
      - "docs/decisions/0015-configuration-and-ui.md"
      - "docs/decisions/0019-pc-gui-toolkit.md"
      - "docs/decisions/README.md"
      - "software/firmware/presets/rotor-presets.yaml"
      - ".github/workflows/gui.yml"

permissions:
  contents: read

jobs:
  pytest:
    name: Library, simulator, and browser UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e software/gui/rotatorctl
          python -m pip install -e software/gui/rotatorctl-gui --no-deps
          python -m pip install "aiohttp>=3.9" "pytest>=8" "playwright>=1.49"
          python -m playwright install --with-deps chromium

      - name: Test
        working-directory: software/gui
        run: pytest
