name: package

on:
  pull_request:
    paths:
      - "software/gui/**"
      - "software/firmware/presets/rotor-presets.yaml"
      - ".github/workflows/package.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e software/gui/rotatorctl
          python -m pip install -e software/gui/rotatorctl-gui --no-deps
          python -m pip install "aiohttp>=3.9" pyinstaller

      - name: Build
        run: python software/gui/packaging/pyinstaller_build.py windows

      - name: Smoke
        run: |
          & "software/gui/packaging/out/RotatorController-Windows.exe" --selftest

      - uses: actions/upload-artifact@v4
        with:
          name: RotatorController-Windows
          path: software/gui/packaging/out/RotatorController-Windows.exe
          if-no-files-found: error

  macos:
    name: macOS dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e software/gui/rotatorctl
          python -m pip install -e software/gui/rotatorctl-gui --no-deps
          python -m pip install "aiohttp>=3.9" pyinstaller

      - name: Build
        run: python software/gui/packaging/pyinstaller_build.py macos

      - name: Smoke
        run: software/gui/packaging/work/dist/RotatorController.app/Contents/MacOS/RotatorController --selftest

      - uses: actions/upload-artifact@v4
        with:
          name: RotatorController-macOS
          path: software/gui/packaging/out/RotatorController-macOS.dmg
          if-no-files-found: error

  linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e software/gui/rotatorctl
          python -m pip install -e software/gui/rotatorctl-gui --no-deps
          python -m pip install "aiohttp>=3.9" pyinstaller

      - name: Build
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: python software/gui/packaging/pyinstaller_build.py linux

      - name: Smoke
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./software/gui/packaging/out/RotatorController-Linux.AppImage --selftest

      - uses: actions/upload-artifact@v4
        with:
          name: RotatorController-Linux
          path: software/gui/packaging/out/RotatorController-Linux.AppImage
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, 'preview') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            dist/RotatorController-Windows/RotatorController-Windows.exe
            dist/RotatorController-macOS/RotatorController-macOS.dmg
            dist/RotatorController-Linux/RotatorController-Linux.AppImage
          body: |
            Standalone Rotator Controller apps. The rotor catalog is inside each build.

            - Windows: `RotatorController-Windows.exe`
            - macOS (Apple silicon, unsigned): `RotatorController-macOS.dmg`. Right-click the app, choose Open, then Open again.
            - Linux x86_64: `RotatorController-Linux.AppImage`

            A tag whose name contains preview, alpha, beta, or rc is a GitHub pre-release. `releases/latest` skips pre-releases.
