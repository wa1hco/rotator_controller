; Board firmware environment. Processor is not chosen yet.
;
; The V4 PCB is drawn around an STM32F405RGTx, but that is a hardware
; fact, not a firmware commitment. The C++17 core under include/ and src/
; has no Arduino types. Host builds use CMake (CMakeLists.txt), which is
; what CI runs.
;
; When a target is selected, add an [env:...] below. Do not point the
; core at the Arduino framework.

[platformio]
src_dir = src
include_dir = include

; [env:controller]
; platform = ststm32
; board = genericSTM32F405RG
; framework = stm32cube
; build_flags = -std=gnu++17
