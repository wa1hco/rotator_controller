; Board firmware stub. The target MCU is the STM32F407VGT6 (LQFP-100).
;
; The C++17 core under include/ and src/ stays processor-agnostic: no
; STM32 headers, no Arduino types. Host builds use CMake (CMakeLists.txt),
; which is what CI runs. This file is not a build CI executes.
;
; The imported V4 PCB is still drawn around an STM32F405RGTx. That
; footprint is not the target. Re-layout is expected and is not done here.
; See docs/decisions/0014-stm32f407-lan8720.md.
;
; Uncomment the env when the board bring-up starts. Do not point the
; core at the Arduino framework.

[platformio]
src_dir = src
include_dir = include

; [env:controller]
; platform = ststm32
; board = genericSTM32F407VGT6
; framework = stm32cube
; build_flags = -std=gnu++17
