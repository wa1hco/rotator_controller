- schema_version: 1
  id: hygain-ham-iv
  maker: CDE / Telex / Hy-Gain (MFJ)
  model: HAM-IV
  aliases:
  - Ham-4
  - HAM-IVX (220 V box)
  axes: az
  family: CDE-AC-brake-pot
  support: v1
  motor:
    type: ac_split_phase_cap_run
    volts: 24
    current_a: 2.25
    cap_uf:
    - 130
    - 156
    cap_vac: null
    cap_location: controller
    cap_note: '130-156 MFD motor-start cap (P/N 5151500/5151501); power transformer 120/26 VAC 10 % duty, thermal switch. Manual: move cap to
      tower for runs >300 ft. N0AX: 120-140 uF. WA1HCO doc: 130-156 uF 50 VAC'
  brake:
    type: wedge_solenoid
    volts: 24
    current_a: 5.0
    coil_ohms: 0.75
    engage_after_stop_s: null
    note: 'Wedge brake; RT-21: brake sets in 6-degree increments'
  sensor:
    type: pot_dual_end_grounded_wiper
    ohms: 500
    wiring: ends 3 (+) and 7 (-), wiper = 1 (common); wiper-to-3 is 0 ohm at full CCW
    excitation: 'stock ~13 VDC across 3-7; DCU-3: 8-9 VDC open, 0-4.5 VDC on 3-1'
  travel:
    range_deg: 360
    overlap_deg: 0
    limit_switches: 'in rotor: terminal 5 -> right limit -> 8; terminal 6 -> left limit -> 4'
  speed:
    min_s: 45
    max_s: 60
    note: 45-60 s at 60 Hz
  duty: transformer 10 % duty; thermal switch trips after 4-5 min continuous, resets in ~10 min (T2X manual, same box design)
  cable:
    conductors: 8
    connector: terminal strip (older); 8-pin Cinch-Jones on box; AMP pigtail at rotor.
    gauge: 'max cable R: 1-2 <= 0.8 ohm, others <= 2.0 ohm'
    pinout: *id001
  sequencing: 'Release brake, wait, run; on stop remove motor drive, keep brake released for coast-down (stock DCU-1 8 s fixed, DCU-3 0-8 s default
    3 s, Rotor-EZ 5 s), then engage brake. Never reverse while turning (DCU-1 manual: reversing hangs the system with brake released); stop, coast,
    then reverse. Run cap is across terminals 4-8 in the control box.'
  speed_control: Not recommended. RT-21 found HAMx/T2X the least responsive to its low-frequency AC PWM and ships AC rotors at MIN SPEED=10 (no
    PWM). DCU-1 uses half-cycle motor pulses over the last 5 deg as a creep mode; triac half-cycle/cycle skipping can mimic this.
  gotchas:
  - 'Terminal 1 carries motor + brake return AND is the pot wiper reference: 60 Hz ripple on the pot reading (why the dual-end + notch design
    exists).'
  - An open limit switch at end of travel looks like 'no current'; not a fault at the end stop.
  - 'RT-21: open pot gets noisy; some users add 30-100 uF from POS to GND at the controller.'
  sources:
  - HAM4
  - DCU3
  - RT21
  - N0AX
  - WA1HCO
  - T2X
  unverified: []
  notes: 'DCU-3 resistance table: brake 1-2 0.75 ohm; half winding 1-8 and 1-4 2.5 ohm; whole motor 4-8 4.5 ohm; pot 3-7 500 ohm (+ cable).'
