presets:
- schema_version: 1
  id: cde-ham-m-s3-5
  maker: CDE (Cornell-Dubilier)
  model: HAM-M (Series 3, 4, 5)
  aliases:
  - Ham-M
  - TR-44 Series 3 (box-compatible)
  axes: az
  family: CDE-AC-brake-pot
  support: v1
  motor:
    type: ac_split_phase_cap_run
    volts: 24
    current_a: 2.25
    cap_uf:
    - 130
    - 130
    cap_vac: null
    cap_location: controller
    cap_note: 130 MFD electrolytic (non-polar), 10 % duty
  brake:
    type: electric_positive_lock
    volts: 24
    current_a: 3.5
    engage_after_stop_s: null
    note: Positive lock into one of 96 segments (3.75 deg spacing); continuous-duty solenoid; stock box has no delay (lever)
  sensor:
    type: pot_dual_end_grounded_wiper
    ohms: 500
    wiring: ends on 3 and 7, wiper = terminal 1 common
    excitation: stock ~13 VDC
  travel:
    range_deg: 360
    overlap_deg: 0
    limit_switches: in rotor, in CW/CCW motor feeds
  speed:
    min_s: 50
    max_s: 50
    note: approx. 50 s per 360 deg
  duty: motor 10 % duty (transformer thermal cutout)
  cable:
    conductors: 8
    connector: screw terminal strip
    gauge: '2 x #18 (1, 2) + 6 x #22 to ~120 ft'
    pinout: &id001
      1: 'common: motor windings, brake, pot wiper (heavy wire)'
      2: brake solenoid (heavy wire)
      3: pot end (+, ~13 VDC in stock box)
      4: motor winding end / run cap
      5: CW drive (via right limit sw. to 8)
      6: CCW drive (via left limit sw. to 4)
      7: pot end (-)
      8: motor winding end / run cap
  sequencing: 'Release brake, wait, run; on stop remove motor drive, keep brake released for coast-down (stock DCU-1 8 s fixed, DCU-3 0-8 s default
    3 s, Rotor-EZ 5 s), then engage brake. Never reverse while turning (DCU-1 manual: reversing hangs the system with brake released); stop, coast,
    then reverse. Run cap is across terminals 4-8 in the control box.'
  speed_control: Not recommended. RT-21 found HAMx/T2X the least responsive to its low-frequency AC PWM and ships AC rotors at MIN SPEED=10 (no
    PWM). DCU-1 uses half-cycle motor pulses over the last 5 deg as a creep mode; triac half-cycle/cycle skipping can mimic this.
  gotchas:
  - Ham-M SERIES 1 and 2 (and TR-44 S1/S2) are wired differently; a later control on them 'will destroy the rotor pot instantly' (NORM). Preset
    must warn; check 500 ohm across 3-7 and cap across 4-8 first.
  - Open, non-sealed wirewound pot gets noisy (RT-21 note).
  sources:
  - HAMM
  - NORM
  - WA1HCO
  unverified:
  - cable.pinout
  notes: Pinout assumed identical to later 8-wire CDE family for Series 3-5, per NORM interchangeability statement.
